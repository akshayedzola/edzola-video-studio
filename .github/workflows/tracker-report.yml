# Regenerates TRACKER.md (stage counts, who is working on what, recently published).
name: tracker-report
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  issues:
    types: [closed, labeled]

permissions:
  contents: write
  issues: read

concurrency:
  group: tracker-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/tracker.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if ! git diff --quiet TRACKER.md; then
            git config user.name "edzola-video-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TRACKER.md
            git commit -m "tracker: update TRACKER.md [skip ci]"
            git push
          fi
