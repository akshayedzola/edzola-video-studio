<!doctype html>
<!-- ep000 v2 · quarter-sim · "Watch a quarter happen".
     The mechanism of fragmentation, live: field events land in ONE sheet each,
     copies drift, reconciling hours climb, and Kavya ends up in three places.
     Times come from narration beats via EZ.b(n)/EZ.at(n, f). Fictional data. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="stylesheet" href="brand.css" />
  <script src="cues.js"></script>
  <script src="gsap.min.js"></script>
  <script src="kit.js"></script>
  <style>
    /* ---- top band: org label, week strip, hours counter ---- */
    #org { position: absolute; left: 120px; top: 98px; font-size: 26px; white-space: nowrap; }
    #org .on { font-weight: 700; }
    #org .om { color: var(--grey); font-weight: 500; }

    #weeks { position: absolute; left: 120px; top: 150px; width: 1280px; height: 60px; }
    #weeks .wlab { position: absolute; left: 0; top: 6px; font-size: 36px; line-height: 1.2; }
    #wfill { position: absolute; left: 118px; top: 2px; height: 56px; width: 82px; border-radius: 14px; background: var(--peach); }
    #whi { position: absolute; left: 118px; top: 2px; height: 56px; width: 82px; border-radius: 14px; background: var(--coral);
      box-shadow: 0 6px 16px rgba(166,76,53,.25); }
    .wc { position: absolute; top: 2px; width: 82px; height: 56px; line-height: 56px; text-align: center;
      font-size: 24px; font-weight: 700; color: var(--ink); border-radius: 14px; border: 2px solid var(--line); }

    #hours { position: absolute; left: 1440px; top: 92px; width: 360px; height: 178px; }
    #hours .hl { position: absolute; left: 28px; top: 20px; font-size: 22px; font-weight: 700; color: var(--grey); white-space: nowrap; }
    #hnum { position: absolute; left: 28px; top: 58px; font-size: 76px; line-height: 1; color: var(--ink); }
    #hunit { position: absolute; left: 230px; top: 112px; font-size: 22px; font-weight: 600; color: var(--grey); }

    /* ---- the field ---- */
    #field { position: absolute; left: 120px; top: 300px; width: 380px; height: 580px; }
    #field .fk { position: absolute; left: 30px; top: 26px; font-size: 22px; }
    .person { position: absolute; left: 20px; width: 340px; height: 150px; }
    .person svg.av { position: absolute; left: 6px; top: 6px; width: 104px; height: 132px; }
    .person .pt { position: absolute; left: 124px; top: 36px; }
    .person .pn { font-size: 28px; font-weight: 700; }
    .person .pr { font-size: 22px; color: var(--grey); margin-top: 4px; }
    .person .pi { position: absolute; left: 272px; top: 40px; width: 56px; height: 56px; }
    #x500 { position: absolute; left: 236px; top: 20px; padding: 6px 16px; border-radius: 999px; background: var(--ink); color: var(--cream);
      font-size: 26px; font-weight: 700; }

    /* ---- the three sheets ---- */
    #sheets { position: absolute; left: 540px; top: 300px; width: 1260px; height: 580px; }
    .sheet { position: absolute; top: 0; width: 400px; height: 580px; overflow: hidden; border-radius: 18px; }
    .sh { height: 64px; padding: 0 22px; display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; color: var(--ink); }
    .sh svg { width: 28px; height: 28px; }
    .sh.prog { background: var(--coral); } .sh.me { background: var(--yellow); } .sh.fin { background: var(--teal); }
    .ch { height: 40px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between;
      font-size: 20px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--grey);
      border-bottom: 2px solid var(--line); background: #faf5f0; }
    .vp { position: absolute; left: 0; top: 104px; width: 400px; height: 460px; overflow: hidden; }
    .list { position: absolute; left: 0; top: 0; width: 400px; } /* rows scroll out of the clipped .vp */
    .row { position: absolute; left: 0; width: 400px; height: 46px; padding: 0 16px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid #efe6dc; background: var(--paper); }
    .row .nm { font-size: 22px; font-weight: 500; white-space: nowrap; }
    .st { font-size: 20px; font-weight: 700; padding: 3px 12px; border-radius: 999px; background: var(--peach); color: var(--ink); white-space: nowrap; }
    .st.ok { background: var(--success-bg); color: var(--success); }
    .st.warn { background: var(--warning-bg); color: var(--warning); }
    .st.bad { background: var(--danger-bg); color: var(--danger); }
    .st2 { position: absolute; right: 16px; top: 8px; }
    .row.kav { box-shadow: inset 0 0 0 3px var(--yellow); }
    .redbar { position: absolute; left: 0; top: 0; width: 6px; height: 46px; background: var(--danger); }

    #links { position: absolute; left: 0; top: 0; width: 1260px; height: 580px; }
    .same { position: absolute; top: 212px; width: 190px; margin-left: -95px; text-align: center; padding: 6px 0; border-radius: 999px;
      background: var(--yellow-soft); border: 2px solid var(--yellow); font-size: 22px; font-weight: 700; color: var(--ink); }
    .ne { position: absolute; width: 52px; height: 52px; margin-left: -26px; border-radius: 50%; background: var(--danger); color: #fff;
      font-size: 34px; font-weight: 800; line-height: 50px; text-align: center; box-shadow: 0 6px 14px rgba(154,60,34,.3); }

    /* tokens */
    .token.ev { color: var(--ink); font-size: 22px; padding: 7px 18px; }
    .token.dot { width: 26px; height: 26px; padding: 0; border-radius: 50%; }
    .c-prog { background: var(--coral); } .c-me { background: var(--yellow); } .c-fin { background: var(--teal); }

    #verdict { position: absolute; left: 0; top: 640px; width: 1920px; text-align: center; font-size: 64px; }
    #verdict em { color: var(--coral-deep); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="quarter-sim" data-start="0" data-duration="{{DURATION}}"
       data-width="1920" data-height="1080" data-fps="30">
    <div id="stage" class="abs" style="inset:0">

      <div id="org"><span class="on">Sitara Foundation</span><span class="om"> · fictional · 500 learners</span></div>

      <div id="weeks"><div class="wlab serif">Week</div><div id="wfill"></div><div id="whi"></div></div>

      <div id="hours" class="card"><div class="hl">Hours spent reconciling</div>
        <div id="hnum" class="serif">0</div></div>

      <!-- the field: three people, simple flat figures -->
      <div id="field" class="card">
        <div class="kicker fk">The field</div>
        <div class="person" id="p0" style="top:70px">
          <svg class="av" viewBox="0 0 104 132"><circle cx="52" cy="38" r="31" fill="#3a2a24"/><circle cx="52" cy="44" r="26" fill="#c08463"/>
            <path d="M26 36 Q52 6 78 36 Q66 22 52 22 Q38 22 26 36Z" fill="#3a2a24"/>
            <path d="M8 132 Q8 82 52 80 Q96 82 96 132Z" fill="#f2c4ad"/></svg>
          <div class="pt"><div class="pn">Kavya</div><div class="pr">Learner</div></div>
          <svg class="pi" viewBox="0 0 56 56"><path d="M6 22 L28 12 L50 22 L28 32Z" fill="#1a1a1a"/><path d="M16 27 V38 Q28 46 40 38 V27 L28 32Z" fill="#6b6360"/><path d="M48 23 V36" stroke="#1a1a1a" stroke-width="3"/></svg>
          <div id="x500">× 500</div>
        </div>
        <div class="person" id="p1" style="top:240px">
          <svg class="av" viewBox="0 0 104 132"><circle cx="52" cy="44" r="26" fill="#9a6a4f"/><path d="M27 38 Q30 14 52 15 Q76 14 78 38 Q70 26 52 26 Q36 26 27 38Z" fill="#2b211d"/>
            <path d="M8 132 Q8 82 52 80 Q96 82 96 132Z" fill="#c9d9d6"/></svg>
          <div class="pt"><div class="pn">Ravi</div><div class="pr">Field officer</div></div>
          <svg class="pi" viewBox="0 0 56 56"><rect x="15" y="4" width="26" height="48" rx="6" fill="#1a1a1a"/><rect x="19" y="10" width="18" height="32" rx="2" fill="#8ecfca"/><circle cx="28" cy="47" r="2.5" fill="#fdf8f4"/></svg>
        </div>
        <div class="person" id="p2" style="top:410px">
          <svg class="av" viewBox="0 0 104 132"><circle cx="52" cy="44" r="26" fill="#b07656"/><path d="M26 44 Q24 14 52 16 Q80 14 78 44 Q76 26 52 24 Q30 26 26 44Z" fill="#4a3a33"/>
            <path d="M8 132 Q8 82 52 80 Q96 82 96 132Z" fill="#e6dbd0"/></svg>
          <div class="pt"><div class="pn">Meera</div><div class="pr">Trainer</div></div>
          <svg class="pi" viewBox="0 0 56 56"><rect x="9" y="8" width="38" height="46" rx="5" fill="#a64c35"/><rect x="14" y="14" width="28" height="35" rx="2" fill="#fff"/>
            <rect x="20" y="4" width="16" height="9" rx="3" fill="#1a1a1a"/><path d="M19 24h18M19 31h18M19 38h12" stroke="#6b6360" stroke-width="3"/></svg>
        </div>
      </div>

      <!-- three separate spreadsheets -->
      <div id="sheets" data-layout-allow-overlap data-layout-allow-occlusion>
        <div class="sheet card" id="s0" style="left:0px">
          <div class="sh prog"><svg viewBox="0 0 28 28"><rect x="3" y="3" width="22" height="22" rx="3" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><path d="M3 11h22M3 18h22M12 3v22" stroke="#1a1a1a" stroke-width="2.5"/></svg>Programme sheet</div>
          <div class="ch"><span>Learner</span><span>Status</span></div>
          <div class="vp"><div class="list" id="l0" data-layout-allow-occlusion data-layout-allow-overlap></div></div></div>
        <div class="sheet card" id="s1" style="left:430px">
          <div class="sh me"><svg viewBox="0 0 28 28"><rect x="3" y="3" width="22" height="22" rx="3" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><path d="M3 11h22M3 18h22M12 3v22" stroke="#1a1a1a" stroke-width="2.5"/></svg>M&amp;E sheet</div>
          <div class="ch"><span>Name</span><span>Attendance</span></div>
          <div class="vp"><div class="list" id="l1" data-layout-allow-occlusion data-layout-allow-overlap></div></div></div>
        <div class="sheet card" id="s2" style="left:860px">
          <div class="sh fin"><svg viewBox="0 0 28 28"><rect x="3" y="3" width="22" height="22" rx="3" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><path d="M3 11h22M3 18h22M12 3v22" stroke="#1a1a1a" stroke-width="2.5"/></svg>Finance sheet</div>
          <div class="ch"><span>Payee</span><span>Stipend</span></div>
          <div class="vp"><div class="list" id="l2" data-layout-allow-occlusion data-layout-allow-overlap></div></div></div>

        <svg id="links" viewBox="0 0 1260 580" data-layout-allow-overlap data-layout-allow-occlusion>
          <path id="lk1" d="M150 150 C150 250, 580 250, 580 150" fill="none" stroke="#8a7f78" stroke-width="3" stroke-dasharray="9 7"/>
          <path id="lk2" d="M580 150 C580 250, 1010 250, 1010 150" fill="none" stroke="#8a7f78" stroke-width="3" stroke-dasharray="9 7"/>
        </svg>
        <div class="same" id="sp1" style="left:365px" data-layout-allow-overlap data-layout-allow-occlusion>same person?</div>
        <div class="same" id="sp2" style="left:795px" data-layout-allow-overlap data-layout-allow-occlusion>same person?</div>
      </div>

      <div id="verdict" class="serif">One learner. <em>Three versions.</em></div>
    </div>
  </div>

  <script>
    (function () {
      var tl = gsap.timeline({paused: true, defaults: {ease: "power2.out"}});
      var b = EZ.b, at = EZ.at, $ = EZ.$, R = EZ.rand;
      var stage = $("#stage");

      // ---------- geometry ----------
      var ROW_H = 46, VIS = 10;
      var SHEET_X = [540, 970, 1400];          // frame x of each sheet
      var LIST_Y = 300 + 104;                  // frame y of first row slot
      var ORIGIN = [[440, 400], [440, 570], [440, 740]];   // Kavya, officer's phone, trainer's clipboard
      var COLS = ["c-prog", "c-me", "c-fin"];

      // ---------- week strip ----------
      var CELL0 = 118, CELL_STEP = 90;
      for (var w = 1; w <= 13; w++) {
        var c = document.createElement("div"); c.className = "wc"; c.textContent = w;
        c.style.left = (CELL0 + (w - 1) * CELL_STEP) + "px"; $("#weeks").appendChild(c);
      }
      function week(n, t, d) {
        tl.to("#whi", {x: (n - 1) * CELL_STEP, duration: d == null ? 0.45 : d, ease: "power2.inOut"}, t);
        tl.to("#wfill", {width: 82 + (n - 1) * CELL_STEP, duration: d == null ? 0.45 : d, ease: "power2.inOut"}, t);
      }

      // ---------- rows ----------
      var counts = [0, 0, 0];
      var rowsBy = [[], [], []];
      function makeRow(s, name, status, cls) {
        var r = document.createElement("div"); r.className = "row";
        r.style.top = (counts[s] * ROW_H) + "px";
        var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = name;
        var st = document.createElement("span"); st.className = "st" + (cls ? " " + cls : ""); st.textContent = status;
        // Rows scroll out of the clipped viewport; the checker can't see the clip.
        [nm, st].forEach(function (e) { e.setAttribute("data-layout-allow-occlusion", ""); e.setAttribute("data-layout-allow-overlap", ""); });
        r.appendChild(nm); r.appendChild(st);
        $("#l" + s).appendChild(r);
        rowsBy[s].push(r);
        return r;
      }
      // A row arrives in sheet s at time t: scroll if the sheet is full, then reveal.
      function landRow(s, t, name, status, cls, red) {
        var idx = counts[s];
        var r = makeRow(s, name, status, cls);
        counts[s]++;
        gsap.set(r, {opacity: 0});
        if (idx >= VIS) tl.to("#l" + s, {y: -(idx - VIS + 1) * ROW_H, duration: 0.22, ease: "power2.out"}, t - 0.12);
        tl.fromTo(r, {opacity: 0, x: -24}, {opacity: 1, x: 0, duration: 0.3, ease: "power3.out"}, t);
        if (red) {
          var bar = document.createElement("div"); bar.className = "redbar"; r.appendChild(bar);
          tl.fromTo(r, {backgroundColor: "#ffffff"}, {backgroundColor: "#f6d9cf", duration: 0.18, yoyo: true, repeat: 3, ease: "none"}, t + 0.1);
          tl.to(r, {backgroundColor: "#fbeee8", duration: 0.3}, t + 0.85);
        } else {
          tl.fromTo(r, {backgroundColor: "#fff3cc"}, {backgroundColor: "#ffffff", duration: 0.7, ease: "power1.out"}, t + 0.15);
        }
        return {row: r, slot: Math.min(idx, VIS - 1)};
      }
      function slotY(slot) { return LIST_Y + slot * ROW_H; }

      // ---------- tokens ----------
      function token(cls, label) {
        var el = document.createElement("div");
        el.className = "token " + (label ? "ev " : "dot ") + cls;
        if (label) el.textContent = label;
        el.setAttribute("data-layout-allow-overlap", ""); el.setAttribute("data-layout-allow-occlusion", "");
        stage.appendChild(el);
        gsap.set(el, {opacity: 0});
        return el;
      }
      // Fly a token from origin o into sheet s's next slot; lands at tLand.
      function send(el, o, s, tLand, dur, slotOverride, lift) {
        var slot = slotOverride != null ? slotOverride : Math.min(counts[s], VIS - 1);
        var x1 = SHEET_X[s] + 24, y1 = slotY(slot) + (el.classList.contains("dot") ? 10 : 4);
        EZ.fly(tl, el, o[0], o[1] - 20, x1, y1, tLand - dur, dur, lift == null ? 110 : lift);
        tl.to(el, {opacity: 0, scale: 0.4, duration: 0.18, ease: "power2.in"}, tLand + 0.02);
      }

      // ---------- hidden start states ----------
      gsap.set(["#org", "#weeks", "#hours", "#field", ".sheet", ".person", "#x500", "#verdict"], {opacity: 0});
      gsap.set(["#lk1", "#lk2", ".same"], {opacity: 0});

      // ---------- b1: the organisation, the field, three empty sheets ----------
      EZ.rise(tl, "#org", b(1) + 0.2, {y: 20});
      EZ.rise(tl, "#field", at(1, 0.25), {y: 30});
      EZ.rise(tl, ".person", at(1, 0.3), {y: 20, stagger: 0.18});
      EZ.rise(tl, ".sheet", at(1, 0.5), {y: 30, stagger: 0.15});
      EZ.rise(tl, "#weeks", at(1, 0.72), {y: 16});
      EZ.rise(tl, "#hours", at(1, 0.82), {y: 16});

      // ---------- b2: Week 1 · enrolment → Programme sheet only ----------
      week(1, b(2) + 0.05, 0.01);
      EZ.pulse(tl, "#p1 .pi", at(2, 0.4), 1.18);
      var tEnrol = token("c-prog", "Enrolled");
      send(tEnrol, ORIGIN[1], 0, at(2, 0.8), at(2, 0.8) - at(2, 0.55));
      var k0 = landRow(0, at(2, 0.8), "Kavya Sharma", "Enrolled", "").row;

      // ---------- b3: Week 2 · paper attendance → (a week later) M&E sheet ----------
      week(2, b(3) + 0.05);
      var tAtt = token("c-me", "Attendance");
      EZ.pulse(tl, "#p2 .pi", at(3, 0.12), 1.18);
      tl.fromTo(tAtt, {opacity: 0, scale: 0.6}, {opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)"}, at(3, 0.18));
      tl.to(tAtt, {y: "-=10", duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut"}, at(3, 0.25)); // waiting on paper
      send(tAtt, ORIGIN[2], 1, at(3, 0.85), at(3, 0.85) - at(3, 0.6));
      var k1 = landRow(1, at(3, 0.85), "K. Sharma", "Present", "").row;

      // ---------- b4: Week 3 · stipend → Finance sheet only ----------
      week(3, b(4) + 0.05);
      var tSti = token("c-fin", "₹ Stipend");
      send(tSti, ORIGIN[0], 2, at(4, 0.6), at(4, 0.6) - at(4, 0.35));
      var k2 = landRow(2, at(4, 0.6), "Kavya S.", "₹ Paid", "").row;

      // Three Kavya rows: yellow outlines + dashed "same person?" links.
      var kav = [k0, k1, k2];
      kav.forEach(function (r) { r.classList.add("kav"); });
      tl.fromTo(kav, {boxShadow: "inset 0 0 0 0px #f7c948"}, {boxShadow: "inset 0 0 0 4px #f7c948", duration: 0.35, stagger: 0.12}, at(4, 0.72));
      tl.fromTo(["#lk1", "#lk2"], {opacity: 0}, {opacity: 1, duration: 0.45, stagger: 0.15}, at(4, 0.8));
      EZ.pop(tl, ["#sp1", "#sp2"], at(4, 0.86), {stagger: 0.15});

      // Kavya rows get final statuses later; build hidden overlay chips now.
      var finals = [["Placed", "ok"], ["Training", "warn"], ["Stipend stopped", "bad"]];
      var finalChips = kav.map(function (r, i) {
        var c = document.createElement("span"); c.className = "st st2 " + finals[i][1]; c.textContent = finals[i][0];
        c.setAttribute("data-layout-allow-overlap", ""); c.setAttribute("data-layout-allow-occlusion", "");
        r.appendChild(c); gsap.set(c, {opacity: 0}); return c;
      });

      // ---------- b5–b7: TIME-LAPSE ----------
      tl.to(["#lk1", "#lk2", ".same"], {opacity: 0, duration: 0.35}, at(5, 0.18));
      EZ.pop(tl, "#x500", b(5) + 0.15);
      tl.to("#x500", {opacity: 0, duration: 0.4}, e5plus(0.2));
      function e5plus(d) { return EZ.e(6) + d; }

      // Week strip races 4 → 13 across beats 5–6.
      var raceA = at(5, 0.4), raceB = EZ.e(6) - 0.2;
      for (var wk = 4; wk <= 13; wk++) week(wk, raceA + (wk - 4) * (raceB - raceA) / 9, 0.22);

      var FIRST = ["Priya", "Rohan", "Aisha", "Meena", "Arjun", "Sana", "Vikram", "Divya", "Imran", "Neha", "Rahul",
                   "Pooja", "Farhan", "Lakshmi", "Deepak", "Anjali", "Suresh", "Ritu", "Kiran", "Asha", "Tara", "Nikhil"];
      var LAST = ["Nair", "Das", "Khan", "Rao", "Iyer", "Shaikh", "Singh", "Reddy", "Ali", "Joshi", "Gupta",
                  "Patel", "Mir", "Menon", "Yadav", "Verma", "Pillai", "Bose", "Kumar", "Thomas", "Sen", "Jain"];
      var STATUS = [[["Enrolled", ""], ["Training", "warn"], ["Placed", "ok"], ["Enrolled", ""]],
                    [["Present", ""], ["Absent", "bad"], ["Present", ""], ["Training", "warn"]],
                    [["₹ Paid", ""], ["Pending", "warn"], ["₹ Paid", ""], ["On hold", "bad"]]];
      function spell(i, s) {
        var f = FIRST[i % FIRST.length], l = LAST[i % LAST.length], v = Math.floor(R() * 3);
        if (s === 0) return v === 2 ? f + " " + l[0] + "." : f + " " + l;
        if (s === 1) return v === 2 ? f[0] + ". " + l + "a" : f[0] + ". " + l;
        return v === 2 ? f.toUpperCase() : f + " " + l[0] + ".";
      }
      function pick(arr) { return arr[Math.floor(R() * arr.length)]; }

      // Drift pairs: one event copied into two sheets that disagree (≠).
      var pairs = [
        {f: at(6, 0.22), a: 0, b: 1, na: "Rohan Das", sa: ["Placed", "ok"], nb: "R. Das", sb: ["Dropped", "bad"], gap: 415},
        {f: at(6, 0.48), a: 1, b: 2, na: "A. Khan", sa: ["Absent", "bad"], nb: "Aisha K.", sb: ["₹ Paid", ""], gap: 845},
        {f: at(6, 0.74), a: 0, b: 1, na: "Divya Reddy", sa: ["Placed", "ok"], nb: "D. Reddi", sb: ["Training", "warn"], gap: 415}
      ];
      function blocked(s, tLand) {
        return pairs.some(function (p) { return (p.a === s || p.b === s) && tLand > p.f - 0.35 && tLand < p.f + 1.0; });
      }

      // Regular event stream: balanced bag of destinations, deterministic.
      var events = [];
      var bag = [];
      function nextDest(tLand) {
        for (var tries = 0; tries < 6; tries++) {
          if (!bag.length) { bag = [0, 1, 2]; for (var i = 2; i > 0; i--) { var j = Math.floor(R() * (i + 1)); var tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp; } }
          var d = bag.shift();
          if (!blocked(d, tLand)) return d;
        }
        return -1;
      }
      var tStart = at(5, 0.32), tEnd = EZ.e(6) - 0.3, n = 42;
      for (var k = 0; k < n; k++) events.push({land: tStart + 0.75 + k * (tEnd - tStart - 0.75) / (n - 1), dur: 0.62 + R() * 0.2});
      // Slower trickle while the counter climbs (beat 7).
      for (var k2i = 0; k2i < 7; k2i++) events.push({land: at(7, 0.08 + k2i * 0.12), dur: 0.85});
      pairs.forEach(function (p) { events.push({pair: p, land: p.f, dur: 0.75}); });
      events.sort(function (x, y) { return x.land - y.land; });

      var who = 0;
      events.forEach(function (ev) {
        var o = ORIGIN[Math.floor(R() * 3)];
        o = [o[0], o[1] + Math.round((R() - 0.5) * 30)];
        if (ev.pair) {
          var p = ev.pair, col = COLS[p.a === 0 ? 0 : 1];
          var ta = token(col), tb = token(col);
          send(ta, o, p.a, p.f, ev.dur, null, 90);
          send(tb, o, p.b, p.f, ev.dur, null, 90);
          var ra = landRow(p.a, p.f, p.na, p.sa[0], p.sa[1], true);
          var rb = landRow(p.b, p.f, p.nb, p.sb[0], p.sb[1], true);
          var ne = document.createElement("div"); ne.className = "ne"; ne.textContent = "≠";
          ne.setAttribute("data-layout-allow-overlap", ""); ne.setAttribute("data-layout-allow-occlusion", "");
          ne.style.left = p.gap + "px"; ne.style.top = (104 + ((ra.slot + rb.slot) / 2) * ROW_H - 3) + "px";
          $("#sheets").appendChild(ne); gsap.set(ne, {opacity: 0});
          EZ.pop(tl, ne, p.f + 0.12, {d: 0.4});
          EZ.shake(tl, ne, p.f + 0.55);
          tl.to(ne, {opacity: 0, duration: 0.3}, p.f + 1.15);
          return;
        }
        var s = nextDest(ev.land);
        if (s < 0) return;
        var tk = token(pick(COLS));
        send(tk, o, s, ev.land, ev.dur);
        var stt = pick(STATUS[s]);
        landRow(s, ev.land, spell(who++, s), stt[0], stt[1], false);
      });

      // ---------- b7: the hours counter climbs 0 → 40 → 80 → 120 ----------
      tl.to("#hours", {borderColor: "#a64c35", duration: 0.4}, b(7) + 0.1);
      EZ.pulse(tl, "#hours", b(7) + 0.2, 1.04);
      var hv = {v: 0}, hEl = $("#hnum");
      function hupd() { hEl.textContent = Math.round(hv.v); }
      [[40, 0.62, 1.12], [80, 0.76, 1.24], [120, 0.92, 1.36]].forEach(function (st, i) {
        var tEndN = at(7, st[1]), d = i === 0 ? 1.1 : 0.55;
        tl.to(hv, {v: st[0], duration: d, ease: "power2.out", onUpdate: hupd}, tEndN - d);
        tl.to(hEl, {scale: st[2], duration: 0.35, ease: "back.out(2)"}, tEndN - 0.12);
      });
      gsap.set(hEl, {transformOrigin: "0% 80%"});

      // ---------- b8: stop at Week 13; zoom on the three Kavya rows ----------
      EZ.pulse(tl, "#whi", b(8), 1.08);
      var others = [];
      rowsBy.forEach(function (rows) { rows.forEach(function (r) { if (kav.indexOf(r) < 0) others.push(r); }); });
      tl.to(others, {opacity: 0, duration: 0.35}, b(8));
      tl.to(["#l0", "#l1", "#l2"], {y: 0, duration: 0.8, ease: "power2.inOut"}, b(8) + 0.15);
      tl.to("#field", {opacity: 0, x: -40, duration: 0.5}, b(8));
      tl.to(".sheet", {height: 166, duration: 0.6, ease: "power2.inOut"}, b(8) + 0.5);
      tl.to("#sheets", {x: -399, y: 40, scale: 1.3, transformOrigin: "0% 0%", duration: 0.9, ease: "power2.inOut"}, b(8) + 0.75);
      // statuses diverge, one by one
      kav.forEach(function (r, i) {
        var old = r.querySelector(".st:not(.st2)"), t = at(8, 0.42) + i * 0.28;
        tl.to(old, {opacity: 0, duration: 0.2}, t);
        tl.fromTo(finalChips[i], {opacity: 0, scale: 0.6}, {opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)"}, t);
        tl.to(r, {backgroundColor: ["#dcefeb", "#fceed0", "#f6d9cf"][i], duration: 0.4}, t);
      });
      // ≠ between the three Kavya rows
      [415, 845].forEach(function (gx, i) {
        var ne = document.createElement("div"); ne.className = "ne"; ne.textContent = "≠";
        ne.setAttribute("data-layout-allow-overlap", ""); ne.setAttribute("data-layout-allow-occlusion", "");
        ne.style.left = gx + "px"; ne.style.top = (104 - 3) + "px";
        $("#sheets").appendChild(ne); gsap.set(ne, {opacity: 0});
        EZ.pop(tl, ne, at(8, 0.72) + i * 0.12, {d: 0.4});
      });
      tl.fromTo("#verdict", {opacity: 0, y: 24}, {opacity: 1, y: 0, duration: 0.6, ease: "power3.out"}, at(8, 0.8));
      EZ.shake(tl, kav, at(8, 0.86));

      EZ.finish(tl, {tag: true});
      window.__timelines = window.__timelines || {};
      window.__timelines["quarter-sim"] = tl;
    })();
  </script>
</body>
